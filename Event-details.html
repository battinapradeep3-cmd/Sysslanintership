<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AURELIA | Event Details</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Inter", sans-serif;
            background: #090807;
            color: #eeeae2;
            min-height: 100vh;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button {
            font-family: inherit;
            cursor: pointer;
        }


        /* ================================
           NAVBAR
        ================================= */

        .details-navbar {
            position: sticky;
            top: 0;
            z-index: 1000;

            height: 78px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 5%;

            background: rgba(9, 8, 7, 0.94);

            backdrop-filter: blur(18px);

            border-bottom: 1px solid
                rgba(201, 169, 110, 0.22);
        }

        .logo {
            font-family: "Playfair Display", serif;

            font-size: 1.8rem;

            letter-spacing: 0.12em;

            color: #e5c98e;
        }

        .back-home {
            padding: 10px 20px;

            border: 1px solid #c9a96e;

            border-radius: 30px;

            color: #e5c98e;

            font-size: 0.72rem;

            font-weight: 600;

            letter-spacing: 0.1em;

            text-transform: uppercase;

            transition: 0.3s ease;
        }

        .back-home:hover {
            background: #c9a96e;

            color: #090807;
        }


        /* ================================
           MAIN
        ================================= */

        .event-details-page {

            min-height: calc(100vh - 78px);

            padding: 90px 5% 100px;

            background:
                radial-gradient(
                    circle at 85% 10%,
                    rgba(201, 169, 110, 0.15),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 10% 90%,
                    rgba(201, 169, 110, 0.07),
                    transparent 30%
                ),
                #090807;
        }

        .details-container {

            width: min(1200px, 100%);

            margin: auto;
        }


        /* ================================
           TOP
        ================================= */

        .event-category {

            display: inline-block;

            margin-bottom: 18px;

            color: #c9a96e;

            font-size: 0.72rem;

            font-weight: 600;

            letter-spacing: 0.22em;

            text-transform: uppercase;
        }

        #eventName {

            font-family: "Playfair Display", serif;

            color: #ffffff;

            font-size: clamp(
                3rem,
                7vw,
                6.5rem
            );

            font-weight: 500;

            line-height: 1;

            letter-spacing: -0.04em;

            margin-bottom: 25px;
        }

        #eventDescription {

            max-width: 800px;

            color: #a9a39a;

            font-size: 1rem;

            line-height: 1.9;

            margin-bottom: 55px;
        }


        /* ================================
           EVENT INFO
        ================================= */

        .event-info-grid {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 16px;

            margin-bottom: 55px;
        }

        .info-box {

            padding: 25px;

            background: #151310;

            border: 1px solid
                rgba(201, 169, 110, 0.22);

            border-radius: 16px;

            transition: 0.3s ease;
        }

        .info-box:hover {

            transform: translateY(-4px);

            border-color: #927545;
        }

        .info-label {

            display: block;

            margin-bottom: 10px;

            color: #c9a96e;

            font-size: 0.65rem;

            letter-spacing: 0.16em;

            text-transform: uppercase;
        }

        .info-value {

            color: #ffffff;

            font-size: 0.92rem;

            line-height: 1.5;
        }


        /* ================================
           TICKET SECTION
        ================================= */

        .ticket-heading {

            margin-bottom: 20px;
        }

        .ticket-heading span {

            color: #c9a96e;

            font-size: 0.68rem;

            letter-spacing: 0.18em;

            text-transform: uppercase;
        }

        .ticket-heading h2 {

            margin-top: 8px;

            font-family: "Playfair Display", serif;

            color: #ffffff;

            font-size: 2.4rem;

            font-weight: 500;
        }

        .ticket-grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 18px;

            margin-bottom: 40px;
        }

        .ticket-card {

            padding: 30px;

            text-align: center;

            background: #151310;

            border: 1px solid
                rgba(201, 169, 110, 0.22);

            border-radius: 16px;

            transition: 0.3s ease;
        }

        .ticket-card:hover {

            transform: translateY(-5px);

            border-color: #c9a96e;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.35);
        }

        .ticket-type {

            display: block;

            margin-bottom: 10px;

            color: #a9a39a;

            font-size: 0.72rem;

            letter-spacing: 0.14em;

            text-transform: uppercase;
        }

        .ticket-price {

            color: #e5c98e;

            font-family: "Playfair Display", serif;

            font-size: 2rem;
        }


        /* ================================
           BOOK BUTTON
        ================================= */

        .booking-area {

            display: flex;

            align-items: center;

            gap: 18px;

            flex-wrap: wrap;
        }

        .book-button {

            min-height: 52px;

            padding: 14px 32px;

            border: 1px solid #c9a96e;

            border-radius: 30px;

            background: #c9a96e;

            color: #090807;

            font-size: 0.75rem;

            font-weight: 700;

            letter-spacing: 0.12em;

            text-transform: uppercase;

            transition: 0.3s ease;
        }

        .book-button:hover {

            background: #e5c98e;

            transform: translateY(-2px);
        }

        .back-button {

            min-height: 52px;

            padding: 14px 28px;

            border: 1px solid
                rgba(201, 169, 110, 0.4);

            border-radius: 30px;

            background: transparent;

            color: #e5c98e;

            font-size: 0.75rem;

            font-weight: 600;

            letter-spacing: 0.1em;

            text-transform: uppercase;

            transition: 0.3s ease;
        }

        .back-button:hover {

            background: #151310;

            border-color: #c9a96e;
        }


        /* ================================
           ERROR
        ================================= */

        .error-message {

            text-align: center;

            padding: 100px 20px;
        }

        .error-message h1 {

            font-family: "Playfair Display", serif;

            font-size: 3rem;

            color: #ffffff;

            margin-bottom: 20px;
        }

        .error-message p {

            color: #a9a39a;

            margin-bottom: 30px;
        }


        /* ================================
           RESPONSIVE
        ================================= */

        @media (max-width: 900px) {

            .event-info-grid {

                grid-template-columns:
                    repeat(2, 1fr);
            }

            .ticket-grid {

                grid-template-columns:
                    repeat(3, 1fr);
            }

        }


        @media (max-width: 650px) {

            .details-navbar {

                height: 70px;

                padding: 0 4%;
            }

            .logo {

                font-size: 1.4rem;
            }

            .back-home {

                padding: 9px 14px;

                font-size: 0.62rem;
            }

            .event-details-page {

                padding:
                    65px 5% 80px;
            }

            #eventName {

                font-size: 3.1rem;
            }

            #eventDescription {

                font-size: 0.9rem;

                margin-bottom: 35px;
            }

            .event-info-grid {

                grid-template-columns: 1fr 1fr;

                gap: 10px;

                margin-bottom: 40px;
            }

            .info-box {

                padding: 18px;
            }

            .info-value {

                font-size: 0.78rem;
            }

            .ticket-grid {

                grid-template-columns: 1fr;

                gap: 12px;
            }

            .ticket-card {

                padding: 22px;
            }

            .booking-area {

                flex-direction: column;

                align-items: stretch;
            }

            .book-button,
            .back-button {

                width: 100%;
            }

        }


        @media (max-width: 400px) {

            #eventName {

                font-size: 2.6rem;
            }

            .event-info-grid {

                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         NAVBAR
    ========================================== -->

    <header class="details-navbar">

        <div class="logo">
            AURELIA
        </div>

        <a
            href="index.html#events"
            class="back-home"
        >
            ← Back to Events
        </a>

    </header>


    <!-- =========================================
         EVENT DETAILS
    ========================================== -->

    <main class="event-details-page">

        <div
            class="details-container"
            id="eventContainer"
        >

            <div class="event-category" id="eventCategory">
                EVENT
            </div>

            <h1 id="eventName">
                Loading...
            </h1>

            <p id="eventDescription">
                Loading event details...
            </p>


            <!-- EVENT INFORMATION -->

            <div class="event-info-grid">

                <div class="info-box">

                    <span class="info-label">
                        Date
                    </span>

                    <div
                        class="info-value"
                        id="eventDate"
                    >
                        —
                    </div>

                </div>


                <div class="info-box">

                    <span class="info-label">
                        Time
                    </span>

                    <div
                        class="info-value"
                        id="eventTime"
                    >
                        —
                    </div>

                </div>


                <div class="info-box">

                    <span class="info-label">
                        Location
                    </span>

                    <div
                        class="info-value"
                        id="eventLocation"
                    >
                        —
                    </div>

                </div>


                <div class="info-box">

                    <span class="info-label">
                        Venue
                    </span>

                    <div
                        class="info-value"
                        id="eventVenue"
                    >
                        —
                    </div>

                </div>

            </div>


            <!-- TICKET PRICES -->

            <div class="ticket-heading">

                <span>
                    Ticket Categories
                </span>

                <h2>
                    Choose Your Experience
                </h2>

            </div>


            <div class="ticket-grid">

                <div class="ticket-card">

                    <span class="ticket-type">
                        Standard
                    </span>

                    <strong
                        class="ticket-price"
                        id="standardPrice"
                    >
                        ₹0
                    </strong>

                </div>


                <div class="ticket-card">

                    <span class="ticket-type">
                        Premium
                    </span>

                    <strong
                        class="ticket-price"
                        id="premiumPrice"
                    >
                        ₹0
                    </strong>

                </div>


                <div class="ticket-card">

                    <span class="ticket-type">
                        VIP
                    </span>

                    <strong
                        class="ticket-price"
                        id="vipPrice"
                    >
                        ₹0
                    </strong>

                </div>

            </div>


            <!-- BUTTONS -->

            <div class="booking-area">

                <button
                    class="book-button"
                    id="bookButton"
                    type="button"
                >
                    Book Tickets
                </button>

                <button
                    class="back-button"
                    type="button"
                    onclick="history.back()"
                >
                    ← Back
                </button>

            </div>

        </div>

    </main>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script>

        const events = {

            velvet: {
                category: "CLASSICAL NIGHT",
                name: "Velvet Symphony",
                date: "20 SEP 2026",
                time: "7:00 PM",
                location: "Vijayawada",
                venue: "The Grand Arena",
                description:
                    "An elegant evening of timeless classical music, breathtaking performances and an unforgettable atmosphere designed for true music lovers.",
                standard: "₹799",
                premium: "₹1499",
                vip: "₹2499"
            },

            noir: {
                category: "PREMIUM NIGHT",
                name: "Midnight Noir",
                date: "25 SEP 2026",
                time: "6:30 PM",
                location: "Visakhapatnam",
                venue: "Harbour Convention Centre",
                description:
                    "Step into a sophisticated midnight experience filled with music, luxury ambience and unforgettable entertainment.",
                standard: "₹649",
                premium: "₹1299",
                vip: "₹2199"
            },

            aurum: {
                category: "JAZZ EXPERIENCE",
                name: "Aurum Jazz",
                date: "02 OCT 2026",
                time: "7:30 PM",
                location: "Hyderabad",
                venue: "Skyline Arena",
                description:
                    "A premium jazz evening combining soulful melodies, extraordinary musicians and a sophisticated golden atmosphere.",
                standard: "₹899",
                premium: "₹1699",
                vip: "₹2799"
            },

            vintner: {
                category: "LUXURY EXPERIENCE",
                name: "Grand Vintner",
                date: "05 OCT 2026",
                time: "7:00 PM",
                location: "Bengaluru",
                venue: "The Garden Stage",
                description:
                    "Experience an elegant evening where refined entertainment, premium ambience and unforgettable moments come together.",
                standard: "₹749",
                premium: "₹1399",
                vip: "₹2299"
            },

            celestial: {
                category: "ROOFTOP EXPERIENCE",
                name: "Celestial Rooftop",
                date: "18 OCT 2026",
                time: "8:00 PM",
                location: "Mumbai",
                venue: "Metro Live Arena",
                description:
                    "An elevated night under the stars featuring premium entertainment, city views and a spectacular rooftop atmosphere.",
                standard: "₹999",
                premium: "₹1899",
                vip: "₹2999"
            },

            imperial: {
                category: "GRAND OPERA",
                name: "Imperial Opera",
                date: "31 OCT 2026",
                time: "6:00 PM",
                location: "Goa",
                venue: "Neon Beach Arena",
                description:
                    "A grand theatrical experience combining powerful performances, elegant production and a magnificent coastal setting.",
                standard: "₹1099",
                premium: "₹1999",
                vip: "₹3499"
            },

            elysian: {
                category: "SIGNATURE EVENT",
                name: "Elysian Nights",
                date: "08 NOV 2026",
                time: "7:30 PM",
                location: "Chennai",
                venue: "Grand Convention Hall",
                description:
                    "A signature evening created for unforgettable entertainment, premium hospitality and extraordinary experiences.",
                standard: "₹899",
                premium: "₹1699",
                vip: "₹2799"
            },

            veloura: {
                category: "LUXURY NIGHT",
                name: "Veloura",
                date: "15 NOV 2026",
                time: "8:00 PM",
                location: "Pune",
                venue: "Imperial Convention Centre",
                description:
                    "A luxurious evening of music, entertainment and premium experiences designed to create lasting memories.",
                standard: "₹1199",
                premium: "₹2199",
                vip: "₹3299"
            },

            noirelan: {
                category: "ELITE EXPERIENCE",
                name: "Noir Élan",
                date: "21 NOV 2026",
                time: "9:00 PM",
                location: "Delhi",
                venue: "The Grand Pavilion",
                description:
                    "A stylish late-night experience featuring premium entertainment and an atmosphere inspired by modern elegance.",
                standard: "₹1299",
                premium: "₹2299",
                vip: "₹3499"
            },

            astral: {
                category: "COSMIC EXPERIENCE",
                name: "Astral Reverie",
                date: "05 DEC 2026",
                time: "8:30 PM",
                location: "Kochi",
                venue: "Waterfront Arena",
                description:
                    "A spectacular waterfront experience bringing together music, lights and an atmosphere inspired by the night sky.",
                standard: "₹1099",
                premium: "₹1999",
                vip: "₹2999"
            }

        };


        /* =========================================
           GET EVENT FROM URL
        ========================================== */

        const params =
            new URLSearchParams(window.location.search);

        const eventKey =
            params.get("event");


        /* =========================================
           DISPLAY EVENT
        ========================================== */

        const event = events[eventKey];


        if (event) {

            document.title =
                "AURELIA | " + event.name;


            document.getElementById(
                "eventCategory"
            ).textContent =
                event.category;


            document.getElementById(
                "eventName"
            ).textContent =
                event.name;


            document.getElementById(
                "eventDescription"
            ).textContent =
                event.description;


            document.getElementById(
                "eventDate"
            ).textContent =
                event.date;


            document.getElementById(
                "eventTime"
            ).textContent =
                event.time;


            document.getElementById(
                "eventLocation"
            ).textContent =
                event.location;


            document.getElementById(
                "eventVenue"
            ).textContent =
                event.venue;


            document.getElementById(
                "standardPrice"
            ).textContent =
                event.standard;


            document.getElementById(
                "premiumPrice"
            ).textContent =
                event.premium;


            document.getElementById(
                "vipPrice"
            ).textContent =
                event.vip;


            /* BOOK TICKETS */

            document.getElementById(
                "bookButton"
            ).addEventListener(
                "click",
                function () {

                    /*
                       If your existing booking function
                       exists, use it.
                    */

                    if (
                        typeof openBooking ===
                        "function"
                    ) {

                        openBooking(event.name);

                    } else {

                        /*
                           Store selected event so
                           booking page can use it.
                        */

                        localStorage.setItem(
                            "selectedEvent",
                            JSON.stringify(event)
                        );

                        window.location.href =
                            "index.html#booking";

                    }

                }
            );

        } else {

            document.getElementById(
                "eventContainer"
            ).innerHTML = `

                <div class="error-message">

                    <h1>
                        Event Not Found
                    </h1>

                    <p>
                        The selected event could not be found.
                    </p>

                    <a
                        href="index.html#events"
                        class="back-home"
                    >
                        Back to Events
                    </a>

                </div>

            `;

        }

    </script>

</body>
</html>
